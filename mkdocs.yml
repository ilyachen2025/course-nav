site_name: 课程资料导航
site_description: 分类索引 · 标题搜索 · 一键打开
site_author: 格索环境集团 · 能源事业部

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  icon:
    logo: material/compass

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 入职必修: 01-onboarding.md
  - 产品与技术: 02-product.md
  - 商务与投标: 03-bidding.md
  - 工程与工具: 04-engineering.md
  - 行业政策与标准: 05-policy.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: 内部培训资料索引 · 仅限企业内部使用
